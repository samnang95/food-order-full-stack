name: food_order_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  go_router: ^14.2.0
  meta: ^1.18.0
  shared_preferences: ^2.3.2
  flutter_localization: ^0.4.1
  flutter_localizations:
    sdk: flutter
  connectivity_plus: ^7.3.1
  http: ^1.6.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
    - assets/translate/
    - assets/animation/
    - assets/icons/
    - assets/sounds/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto/static/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto/static/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto/static/Roboto-Bold.ttf
          weight: 700
    - family: Hanuman
      fonts:
        - asset: assets/fonts/Hanuman/static/Hanuman-Regular.ttf
        - asset: assets/fonts/Hanuman/static/Hanuman-Bold.ttf
          weight: 700

