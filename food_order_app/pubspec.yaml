name: food_order_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1
platforms:
  android:
  ios:

environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.3
  meta: ^1.18.0
  shared_preferences: ^2.3.2
  flutter_localization: ^0.4.1
  flutter_localizations:
    sdk: flutter
  connectivity_plus: ^7.3.1
  http: ^1.6.0
  flutter_svg: ^2.3.0
  flutter_dotenv: ^6.0.1
  wakelock_plus: ^1.8.0
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/bitecraft_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
    - assets/translate/
    - assets/animation/
    - assets/icons/
    - assets/sounds/
    - .env.dev
    - .env.staging
    - .env.prod
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto/static/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto/static/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto/static/Roboto-Bold.ttf
          weight: 700
    - family: Hanuman
      fonts:
        - asset: assets/fonts/Hanuman/static/Hanuman-Regular.ttf
        - asset: assets/fonts/Hanuman/static/Hanuman-Bold.ttf
          weight: 700

