<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ea580c" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#brand-grad)" filter="url(#shadow)"/>
  <!-- Cloche & Steam Restaurant Icon -->
  <g fill="#ffffff">
    <!-- Plate base -->
    <path d="M14 44c0 1.1 1.8 2 4 2h28c2.2 0 4-.9 4-2s-1.8-2-4-2H18c-2.2 0-4 .9-4 2z"/>
    <!-- Cloche dome -->
    <path d="M32 20c-8.8 0-16 6.3-16 14h32c0-7.7-7.2-14-16-14z"/>
    <!-- Handle -->
    <circle cx="32" cy="17" r="3"/>
    <!-- Steam / Warmth waves -->
    <circle cx="26" cy="11" r="1.5" opacity="0.8"/>
    <circle cx="32" cy="9" r="1.8" opacity="0.9"/>
    <circle cx="38" cy="11" r="1.5" opacity="0.8"/>
  </g>
</svg>